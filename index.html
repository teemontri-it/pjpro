<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .login-box{
      width:350px;
      background:white;
      padding:40px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .login-box h1{
      text-align:center;
      margin-bottom:30px;
      color:#333;
    }

    .input-box{
      margin-bottom:20px;
    }

    .input-box input{
      width:100%;
      padding:15px;
      border:none;
      background:#f1f1f1;
      border-radius:10px;
      font-size:16px;
      outline:none;
      transition:0.3s;
    }

    .input-box input:focus{
      background:#e3f2fd;
      border:1px solid #2196f3;
    }

    .login-btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:10px;
      background:#2196f3;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#1976d2;
    }

    .extra{
      margin-top:20px;
      text-align:center;
      color:#666;
      font-size:14px;
    }

    .extra a{
      color:#2196f3;
      text-decoration:none;
    }

    .extra a:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Login</h1>

    <div class="input-box">
      <input type="text" placeholder="Username">
    </div>

    <div class="input-box">
      <input type="password" placeholder="Password">
    </div>

    <button class="login-btn" onclick="login()">
      Sign In
    </button>

    <div class="extra">
      Forgot password? <a href="#">Reset</a>
    </div>
  </div>

  <script>
    function login(){
      alert("Login Success 🚀");
    }
  </script>

</body>
</html>
