<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4facfe,#00f2fe);
font-family:Arial;
}
.box{
background:white;
padding:40px;
border-radius:20px;
width:300px;
text-align:center;
}
input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
background:#f1f1f1;
border-radius:8px;
}
button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#2196f3;
color:white;
}
</style>
</head>
<body>
<div class="box">
<h2>Login</h2>
<input placeholder="Username">
<input type="password" placeholder="Password">
<button onclick="alert('Login Success 🚀')">Login</button>
</div>
</body>
</html>
